<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="./css/catalog.css" />
    <title>Home - Netflix</title>
  </head>
  <body>
    <!-- HEADER -->
    <header
      class="netflix-header d-flex align-items-center justify-content-between px-4 py-2"
    >
      <div class="logo">
        <h1 class="m-0">Netflix</h1>
      </div>

      <nav class="nav-links d-none d-md-flex gap-3">
        <a href="home.html" class="text-white text-decoration-none">Home</a>
        <a href="#movies" class="text-white text-decoration-none">Movies</a>
        <a href="#series" class="text-white text-decoration-none">Series</a>
      </nav>

      <div class="header-icons d-flex gap-3">
        <i class="bi bi-heart-fill text-white fs-4" id="favorites-btn"></i>
        <i class="bi bi-person-circle text-white fs-4" id="user-btn"></i>
      </div>
    </header>

    <!-- CATALOG CONTENT -->
    <main class="catalog-page">
      <section class="catalog-section">
        <h2 class="catalog-title">Movies</h2>
        <div class="catalog-grid" id="movies"></div>
      </section>

      <section class="catalog-section">
        <h2 class="catalog-title">Series</h2>
        <div class="catalog-grid" id="series"></div>
      </section>
    </main>

    <script src="./js/catalog.js"></script>
  </body>
</html>
